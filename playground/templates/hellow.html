<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:#212121;">
    <a href="{{ url }}" style="color:#e9e9e9;">{{ url }}</a>
    {% for item in items %}
    <span style="color:#e9e9e9;">{{ item.title }}</span>
    <span style="color:#e9e9e9;">{{ item.unit_price }}</span>
    <br>
    {% endfor %}
    <br>
    {% for member in gold_members %}
    <span style="color:#e9e9e9;">{{ member.first_name }} {{ member.last_name }}</span>
    <br>
    {% endfor %}
    <br>
</body>
</html>
