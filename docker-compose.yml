services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 storefront.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_change_me_in_prod
      - ALLOWED_HOSTS=*
      - DATABASE_URL=mysql://root:root@db:3306/storefront
      - REDIS_URL=redis://redis:6379/1
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
      - CELERY_BROKER_URL=redis://redis:6379/1
      - RUN_MIGRATIONS=true
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: storefront
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  worker:
    build: .
    command: celery -A storefront worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_change_me_in_prod
      - DATABASE_URL=mysql://root:root@db:3306/storefront
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A storefront beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_change_me_in_prod
      - DATABASE_URL=mysql://root:root@db:3306/storefront
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
    depends_on:
      - db
      - redis

volumes:
  db_data:
  static_volume:
  media_volume:
